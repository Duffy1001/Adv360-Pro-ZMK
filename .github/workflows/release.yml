name: Release

on:
  workflow_run:
    workflows: ["Build"] # Replace with exact name of existing workflow
    types:
      - completed

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Download the artifacts from the completed workflow
      - name: Download artifacts
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: ${{ github.event.workflow_run.workflow_id }}
          run_id: ${{ github.event.workflow_run.id }}
          path: artifacts
      
      # Get the current date for the release tag
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
      
      # Create the GitHub Release and upload all artifacts in one step
      - name: Create Release with Artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: keymap-${{ steps.date.outputs.date }}
          name: Keymap Release ${{ steps.date.outputs.date }}
          files: artifacts/**/*
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
